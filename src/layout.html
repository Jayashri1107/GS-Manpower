<!doctype html>
<html lang="{{htmlLang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  {{hreflang}}
  {{robots}}
  <meta name="theme-color" content="#14213D">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta property="og:image" content="{{baseUrl}}/assets/img/og-image.png">
  <link rel="icon" href="assets/img/gs-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Manrope:wght@400;500;600;700&family=Mukta:wght@600;800&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="application/ld+json">{{jsonld}}</script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  {{> icons}}
  {{> header}}
  <main id="main" tabindex="-1">
{{content}}
  </main>
  {{> footer}}
  {{> consent}}
</body>
</html>
