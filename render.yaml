# Render blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repository. Then fill the "sync: false" values in the dashboard.
services:
  - type: web
    name: gs-manpower
    runtime: node
    plan: starter            # a paid plan is needed for the persistent disk below
    region: singapore
    buildCommand: node build.js
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: gsm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_KEY
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL_TO
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false
